<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧班級分組系統</title>
    
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 載入 React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 載入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const iconPaths = {
            Users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
            UserPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>',
            Ban: '<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>',
            LayoutGrid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
            RotateCcw: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
            AlertCircle: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
            Trash2: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
            Wand2: '<path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/>',
            MapPin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
            Link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
            Plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
            Minus: '<line x1="5" y1="12" x2="19" y2="12"/>',
            Shuffle: '<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
            GitMerge: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>',
            Upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
            FileText: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>',
            Calculator: '<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/><path d="M8 18h.01"/><path d="M12 14h.01"/><path d="M12 18h.01"/>',
            CheckCircle2: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
            Download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
            FolderOpen: '<path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/>'
        };

        const Icon = ({ name, className }) => {
            if (!iconPaths[name]) return null;
            return <svg className={className} dangerouslySetInnerHTML={{__html: iconPaths[name]}} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />;
        };

        const Card = ({ children, className = "" }) => <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 ${className}`}>{children}</div>;
        const CardHeader = ({ children, className = "" }) => <div className={`p-4 border-b border-slate-100 ${className}`}>{children}</div>;
        const CardTitle = ({ children, className = "" }) => <h3 className={`text-lg font-bold text-slate-800 ${className}`}>{children}</h3>;
        const CardContent = ({ children, className = "" }) => <div className={`p-4 ${className}`}>{children}</div>;

        const shuffleArray = (array) => {
          const newArr = [...array];
          for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
          }
          return newArr;
        };

        function SeatingPlanner() {
          const [viewMode, setViewMode] = useState('teacher'); 
          const [activeTab, setActiveTab] = useState('input');
          const [students, setStudents] = useState([]);
          const [groupCapacities, setGroupCapacities] = useState([5, 5, 4, 4, 4]); 
          const [constraints, setConstraints] = useState([]); 
          const [algorithm, setAlgorithm] = useState('stratified'); 
          const [groups, setGroups] = useState([]);
          
          const [newStudent, setNewStudent] = useState({ seatNumber: '', name: '', score: '', gender: 'M' });
          const [bulkInput, setBulkInput] = useState('');
          const [constraintInput, setConstraintInput] = useState({ s1: '', s2: '', type: 'ban', targetGroup: 1 });
          
          const [isCalculating, setIsCalculating] = useState(false);
          const [toastMessage, setToastMessage] = useState('');
          const [fakeInputList, setFakeInputList] = useState('');
          const [importMode, setImportMode] = useState('replace');
          const [isConfirmingClear, setIsConfirmingClear] = useState(false);
          const [swapSource, setSwapSource] = useState(null); // 用於手動微調的來源學生
          
          const toastTimerRef = useRef(null);
          const calculationTimerRef = useRef(null);

          // 📂 初始化：從 LocalStorage 讀取資料
          useEffect(() => {
            try {
              const savedData = localStorage.getItem('ClassSeatingData');
              if (savedData) {
                const parsed = JSON.parse(savedData);
                if (parsed.students && parsed.students.length > 0) setStudents(parsed.students);
                if (parsed.groupCapacities) setGroupCapacities(parsed.groupCapacities);
                if (parsed.constraints) setConstraints(parsed.constraints);
              }
            } catch (e) {
              console.error("讀取存檔失敗", e);
            }
          }, []);

          // 💾 資料變動時：寫入 LocalStorage
          useEffect(() => {
             const dataToSave = { students, groupCapacities, constraints };
             localStorage.setItem('ClassSeatingData', JSON.stringify(dataToSave));
          }, [students, groupCapacities, constraints]);

          const showToast = (msg) => {
             setToastMessage(msg);
             if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
             toastTimerRef.current = setTimeout(() => setToastMessage(''), 3000);
          };

          // 📥 匯出資料為 JSON 檔案
          const exportData = () => {
             if (students.length === 0) {
                 showToast('目前沒有資料可以匯出喔！');
                 return;
             }
             const dataToSave = { students, groupCapacities, constraints };
             const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: "application/json" });
             const url = URL.createObjectURL(blob);
             const a = document.createElement('a');
             a.href = url;
             a.download = `班級分組存檔_${new Date().toISOString().slice(0,10)}.json`;
             a.click();
             URL.revokeObjectURL(url);
             showToast('📥 存檔已下載！');
          };

          // 📂 讀取 JSON 存檔
          const importData = (event) => {
             const file = event.target.files[0];
             if (!file) return;
             const reader = new FileReader();
             reader.onload = (e) => {
                try {
                   const parsed = JSON.parse(e.target.result);
                   if (parsed.students) setStudents(parsed.students);
                   if (parsed.groupCapacities) setGroupCapacities(parsed.groupCapacities);
                   if (parsed.constraints) setConstraints(parsed.constraints);
                   setGroups([]); 
                   showToast('📂 存檔讀取成功！');
                } catch (error) {
                   showToast('❌ 檔案格式錯誤，讀取失敗');
                }
             };
             reader.readAsText(file);
             event.target.value = ''; 
          };

          const handleClearData = () => {
              if (!isConfirmingClear) {
                  setIsConfirmingClear(true);
                  setTimeout(() => setIsConfirmingClear(false), 3000);
                  showToast('⚠️ 再次點擊以確認清除所有資料');
              } else {
                  localStorage.removeItem('ClassSeatingData');
                  setStudents([]);
                  setConstraints([]);
                  setGroups([]);
                  setIsConfirmingClear(false);
                  showToast('🗑️ 本機資料已完全清除');
              }
          };

          // 📋 複製結果名單
          const copyResultsToClipboard = () => {
             if (groups.length === 0) return;
             let text = "📋 本次分組名單：\n\n";
             groups.forEach(g => {
                text += `【第 ${g.id} 組】\n`;
                text += g.members.map(m => `${m.seatNumber}號 ${m.name}`).join('、') + '\n\n';
             });
             
             const textArea = document.createElement("textarea");
             textArea.value = text;
             document.body.appendChild(textArea);
             textArea.select();
             try {
                document.execCommand('copy');
                showToast('✅ 名單已複製！可直接貼上至 LINE 或群組');
             } catch (err) {
                showToast('❌ 複製失敗，請手動選取複製');
             }
             document.body.removeChild(textArea);
          };

          const parseAttendanceNames = (text) => {
            const tokens = text.replace(/[,，]/g, ' ').split(/\s+/).map(v => v.trim()).filter(Boolean);
            const result = new Set();
            for (let i = 0; i < tokens.length; i++) {
              if (/^\d+$/.test(tokens[i]) && tokens[i + 1]) result.add(tokens[i]);
              else result.add(tokens[i]);
            }
            return result;
          };

          const getRosterForRun = () => {
            if (viewMode !== 'student' || !fakeInputList.trim()) return students;
            const tokens = parseAttendanceNames(fakeInputList);
            const active = students.filter(s => tokens.has(String(s.seatNumber)) || tokens.has(String(s.name)));
            if (!active.length) {
              showToast('找不到相符的座號或姓名，將使用完整名單');
              return students;
            }
            return active;
          };

          const addStudent = () => {
            const score = Number(newStudent.score);
            if (!newStudent.seatNumber.trim() || !newStudent.name.trim() || !newStudent.score || !Number.isInteger(score) || score <= 0) {
                showToast('請填寫完整：座號、姓名、排名');
                return;
            }
            if (students.some(s => String(s.seatNumber) === String(newStudent.seatNumber).trim())) {
                showToast('座號已存在，請確認名單');
                return;
            }
            const id = Date.now();
            setStudents([...students, { ...newStudent, seatNumber: newStudent.seatNumber.trim(), name: newStudent.name.trim(), id, score }].sort((a,b)=>a.score-b.score));
            setNewStudent({ seatNumber: '', name: '', score: '', gender: 'M' });
            showToast('已加入學生');
          };

          const deleteStudent = (id) => {
            setStudents(students.filter(s => s.id !== id));
            setConstraints(constraints.filter(c => String(c.s1) !== String(id) && String(c.s2) !== String(id)));
            setGroups([]);
          };

          // 🚀 升級版：智慧正則解析 (支援無空格連續貼上)
          const handleBulkImport = () => {
            if (!bulkInput.trim()) return;
            const parsedStudents = [];
            const seenSeats = new Set();
            let invalidCount = 0;

            // 邏輯: (\d+)座號 -> ([^\d]+?)姓名 -> (\d+)排名 -> ([男女MFmfGIRLboy]*)性別
            const regex = /(\d+)\s*([^\d]+?)\s*(\d+)\s*([男女MFmfGIRLboy]*)(?=\s*\d|$)/gi;
            const normalizedInput = bulkInput.replace(/[,，。、]/g, ' ');
            const matches = [...normalizedInput.matchAll(regex)];

            if (matches.length > 0) {
              matches.forEach(match => {
                const seatNumber = match[1].trim();
                const name = match[2].trim();
                const score = Number(match[3]);
                let gender = 'M'; 
                
                const gInput = match[4] ? match[4].toUpperCase().trim() : '';
                if (['F', '女', 'GIRL'].includes(gInput)) gender = 'F';

                if (!isNaN(score) && Number.isInteger(score) && score > 0 && !seenSeats.has(seatNumber)) {
                  parsedStudents.push({ id: Date.now() + Math.random(), seatNumber, name, score, gender });
                  seenSeats.add(seatNumber);
                } else {
                  invalidCount++;
                }
              });
            }

            if (parsedStudents.length > 0) {
              const base = importMode === 'replace' ? [] : students;
              const existingSeats = new Set(base.map(s => String(s.seatNumber)));
              const duplicates = parsedStudents.filter(s => existingSeats.has(String(s.seatNumber)));
              
              if (duplicates.length && importMode === 'append') {
                showToast(`有 ${duplicates.length} 筆座號重複，未匯入重複資料`);
              }
              
              const finalStudents = [...base, ...parsedStudents.filter(s => !existingSeats.has(String(s.seatNumber)))].sort((a,b)=>a.score-b.score);
              setStudents(finalStudents);
              setGroups([]); 
              if (importMode === 'replace') setConstraints([]); 
              setBulkInput('');
              
              if (!duplicates.length) {
                 showToast(`${importMode === 'replace' ? '已取代' : '已追加'} ${parsedStudents.length} 位學生`);
              }
              if (invalidCount > 0) {
                 setTimeout(() => showToast(`部分格式有誤，已略過`), 3000);
              }
            } else {
              showToast('格式錯誤。請確認包含：座號 姓名 排名 性別');
            }
          };

          const updateCapacity = (index, delta) => {
             const newCap = [...groupCapacities];
             if (newCap[index] + delta > 0) {
                newCap[index] += delta;
                setGroupCapacities(newCap);
             }
          };

          const addGroup = () => setGroupCapacities([...groupCapacities, 4]);
          
          const removeGroup = (index) => {
             if (groupCapacities.length <= 2) {
                 showToast('至少保留兩組！');
                 return;
             }
             const newCap = [...groupCapacities];
             newCap.splice(index, 1);
             setGroupCapacities(newCap);
          };

          const autoBalanceCapacities = () => {
             if (students.length === 0) return;
             const total = students.length;
             const groups = groupCapacities.length;
             const base = Math.floor(total / groups);
             let remainder = total % groups;
             
             const newCap = Array(groups).fill(base);
             for(let i=0; i<remainder; i++) newCap[i]++; 
             setGroupCapacities(newCap);
             showToast('已自動平均分配座位！');
          };

          const addConstraint = () => {
            const s1 = constraintInput.s1; 
            if (constraintInput.type === 'assign') {
               const tg = Number(constraintInput.targetGroup);
               if (!s1 || !tg) return;
               const filteredC = constraints.filter(c => !(c.type === 'assign' && c.s1 === s1));
               setConstraints([...filteredC, { s1, targetGroup: tg, type: 'assign' }]);
               setConstraintInput({ ...constraintInput, s1: '' });
               showToast('已鎖定座位');
               return;
            }

            const s2 = constraintInput.s2;
            if (!s1 || !s2 || s1 === s2) return;
            const exists = constraints.some(c => c.type !== 'assign' && ((c.s1 === s1 && c.s2 === s2) || (c.s1 === s2 && c.s2 === s1)));
            if (exists) {
              showToast("這兩位學生已經有互動規則了！");
              return;
            }
            setConstraints([...constraints, { s1, s2, type: constraintInput.type }]);
            setConstraintInput({ ...constraintInput, s1: '', s2: '' });
            showToast('規則已加入');
          };

          const removeConstraint = (index) => {
            const newC = [...constraints];
            newC.splice(index, 1);
            setConstraints(newC);
          };

          const handleSecretToggle = () => {
             if (viewMode === 'teacher') {
                setActiveTab('result'); 
                setViewMode('student');
             } else {
                setViewMode('teacher');
             }
          };

          const clearGroups = () => {
            setGroups([]);
            setFakeInputList('');
            setSwapSource(null);
          };

          // 🔄 計算組別的狀態與衝突
          const applyGroupStats = (targetGroups, activeConstraints) => {
              const newGroups = [...targetGroups];
              newGroups.forEach(g => {
                g.members.sort((a, b) => a.score - b.score);
                const scoreSum = g.members.reduce((acc, m) => acc + m.score, 0);
                const issues = [];
                activeConstraints.forEach(c => {
                  const g1 = newGroups.findIndex(grp => grp.members.some(m => String(m.id) === String(c.s1)));
                  const g2 = c.type === 'assign' ? c.targetGroup - 1 : newGroups.findIndex(grp => grp.members.some(m => String(m.id) === String(c.s2)));
                  if (g1 < 0 || g2 < 0) return;
                  if (c.type === 'ban' && g1 === g2) issues.push(`不要同組：${getStudentName(c.s1)}、${getStudentName(c.s2)}`);
                  if (c.type === 'pair' && g1 !== g2) issues.push(`一定要同組：${getStudentName(c.s1)}、${getStudentName(c.s2)}`);
                  if (c.type === 'assign' && g1 !== g2) issues.push(`指定組別：${getStudentName(c.s1)} → 第 ${c.targetGroup} 組`);
                });
                g.stats = {
                  avg: g.members.length ? (scoreSum / g.members.length).toFixed(1) : 0,
                  mCount: g.members.filter(m => m.gender === 'M').length,
                  fCount: g.members.filter(m => m.gender === 'F').length,
                  hasConflict: issues.some(issue => issue.includes(`第 ${g.id} 組`) || g.members.some(m => issue.includes(m.name))),
                  issues
                };
              });
              return newGroups;
          };

          // 🔄 點擊學生交換座位的邏輯
          const handleSeatClick = (groupId, studentId) => {
             if (!swapSource) {
                 // 選擇第一位學生
                 if (studentId) {
                     setSwapSource({ groupId, studentId });
                     showToast('📍 請點擊另一位學生或空位來進行交換');
                 } else {
                     showToast('請先選擇要移動的學生！');
                 }
             } else {
                 // 點擊同一個人，取消選擇
                 if (swapSource.groupId === groupId && swapSource.studentId === studentId) {
                     setSwapSource(null); 
                     return;
                 }

                 // 執行交換
                 let newGroups = groups.map(g => ({ ...g, members: [...g.members] }));
                 const srcGroup = newGroups.find(g => g.id === swapSource.groupId);
                 const destGroup = newGroups.find(g => g.id === groupId);
                 
                 const srcStudentIdx = srcGroup.members.findIndex(m => m.id === swapSource.studentId);
                 const srcStudent = srcGroup.members[srcStudentIdx];

                 if (studentId) {
                     // 與另一位學生交換
                     const destStudentIdx = destGroup.members.findIndex(m => m.id === studentId);
                     const destStudent = destGroup.members[destStudentIdx];
                     srcGroup.members.splice(srcStudentIdx, 1, destStudent);
                     destGroup.members.splice(destStudentIdx, 1, srcStudent);
                 } else {
                     // 移動到空位
                     if (destGroup.members.length >= destGroup.capacity) {
                         showToast('目標組別已滿，無法移入！');
                         setSwapSource(null);
                         return;
                     }
                     srcGroup.members.splice(srcStudentIdx, 1);
                     destGroup.members.push(srcStudent);
                 }

                 // 重新計算衝突並更新狀態
                 const roster = getRosterForRun();
                 const activeIds = new Set(roster.map(s => String(s.id)));
                 const activeConstraints = constraints.filter(c => {
                    if (c.type === 'assign') return activeIds.has(String(c.s1));
                    return activeIds.has(String(c.s1)) && activeIds.has(String(c.s2));
                 });

                 setGroups(applyGroupStats(newGroups, activeConstraints));
                 setSwapSource(null);
                 showToast('🔄 座位已手動更新！');
             }
          };

          const getStudentName = (id) => students.find(s => String(s.id) === String(id))?.name || '未知';

          const generateGroups = () => {
            const roster = getRosterForRun();
            const totalSeats = groupCapacities.reduce((a,b)=>a+b, 0);
            if (roster.length === 0) {
              showToast("請先輸入學生資料！");
              return;
            }
            if (totalSeats < roster.length) {
              showToast(`座位不夠！學生有 ${roster.length} 人，但座位只有 ${totalSeats} 個。`);
              return;
            }

            // 🛡️ 缺席防呆：過濾掉有牽涉到缺席者的規則
            const activeIds = new Set(roster.map(s => String(s.id)));
            const activeConstraints = constraints.filter(c => {
               if (c.type === 'assign') return activeIds.has(String(c.s1));
               return activeIds.has(String(c.s1)) && activeIds.has(String(c.s2));
            });

            const assignmentCounts = {};
            activeConstraints.filter(c => c.type === 'assign').forEach(c => {
              assignmentCounts[c.targetGroup] = (assignmentCounts[c.targetGroup] || 0) + 1;
            });
            const overfull = Object.entries(assignmentCounts).find(([groupNo, count]) => count > (groupCapacities[Number(groupNo) - 1] || 0));
            if (overfull) {
              showToast(`第 ${overfull[0]} 組的指定人數超過座位上限`);
              return;
            }

            setIsCalculating(true);
            setSwapSource(null);
            
            calculationTimerRef.current = setTimeout(() => {
              // 1. 初始化空組別
              let tempGroups = groupCapacities.map((cap, i) => ({
                id: i + 1,
                capacity: cap,
                members: [],
                stats: { avg: 0, mCount: 0, fCount: 0, hasConflict: false }
              }));

              // 2. 預先安插「指定組別」的學生
              const assignedIds = new Set();
              activeConstraints.forEach(c => {
                 if (c.type === 'assign') {
                    const student = roster.find(s => String(s.id) === String(c.s1));
                    if (student && c.targetGroup >= 1 && c.targetGroup <= tempGroups.length) {
                       tempGroups[c.targetGroup - 1].members.push(student);
                       assignedIds.add(student.id);
                    }
                 }
              });

              // 3. 準備尚未被指定的學生
              let boys = roster.filter(s => s.gender === 'M' && !assignedIds.has(s.id)).sort((a, b) => a.score - b.score);
              let girls = roster.filter(s => s.gender === 'F' && !assignedIds.has(s.id)).sort((a, b) => a.score - b.score);

              // 核心發牌函式：具備性別防護機制
              const distribute = (list, genderStr) => {
                 list.forEach(student => {
                    tempGroups.sort((a, b) => {
                       const isFullA = a.members.length >= a.capacity;
                       const isFullB = b.members.length >= b.capacity;
                       if (isFullA && !isFullB) return 1;
                       if (!isFullA && isFullB) return -1;

                       const limitA = Math.ceil(a.capacity / 2);
                       const limitB = Math.ceil(b.capacity / 2);
                       const genderCountA = a.members.filter(m => m.gender === genderStr).length;
                       const genderCountB = b.members.filter(m => m.gender === genderStr).length;
                       
                       const overLimitA = genderCountA >= limitA;
                       const overLimitB = genderCountB >= limitB;
                       
                       if (overLimitA && !overLimitB) return 1;
                       if (!overLimitA && overLimitB) return -1;

                       const vacancyA = a.capacity - a.members.length;
                       const vacancyB = b.capacity - b.members.length;
                       if (vacancyA !== vacancyB) return vacancyB - vacancyA; 

                       const sumA = a.members.reduce((acc, m) => acc + m.score, 0);
                       const sumB = b.members.reduce((acc, m) => acc + m.score, 0);
                       return sumB - sumA;
                    });
                    
                    if (tempGroups[0].members.length < tempGroups[0].capacity) {
                        tempGroups[0].members.push(student);
                    }
                 });
              };

              if (algorithm === 'snake') {
                 distribute(boys, 'M');
                 distribute(girls, 'F');
              } else {
                 const maxLen = Math.max(boys.length, girls.length);
                 let interleaved = [];
                 for(let i=0; i<maxLen; i++){
                    if (i < boys.length) interleaved.push(boys[i]);
                    if (i < girls.length) interleaved.push(girls[i]);
                 }
                 
                 const sliceSize = tempGroups.length; 
                 for (let i=0; i<interleaved.length; i+=sliceSize) {
                    let chunk = interleaved.slice(i, i+sliceSize);
                    chunk = shuffleArray(chunk);
                    chunk.forEach(student => distribute([student], student.gender));
                 }
              }

              // 恢復組別順序
              tempGroups.sort((a, b) => a.id - b.id);

              // 輔助檢查能否移動
              const canMove = (studentId, proposedGroupIdx) => {
                 const assignRule = activeConstraints.find(c => c.type === 'assign' && String(c.s1) === String(studentId));
                 if (assignRule) return (assignRule.targetGroup - 1) === proposedGroupIdx;
                 return true;
              };

              let iteration = 0;
              let hasIssue = true;
              while (hasIssue && iteration < 300) {
                hasIssue = false;
                iteration++;
                
                const memberMap = {};
                tempGroups.forEach((g, gIdx) => g.members.forEach(m => memberMap[m.id] = gIdx));

                for (const constraint of activeConstraints) {
                  if (constraint.type === 'assign') continue;

                  const g1 = memberMap[constraint.s1];
                  const g2 = memberMap[constraint.s2];
                  if (g1 === undefined || g2 === undefined) continue;

                  if (constraint.type === 'ban' && g1 === g2) {
                    hasIssue = true;
                    const groupIndex = g1;
                    const studentA = tempGroups[groupIndex].members.find(m => String(m.id) === String(constraint.s1));
                    let swapped = false;
                    const targetIndices = shuffleArray(Array.from({length: tempGroups.length}, (_, i) => i).filter(i => i !== groupIndex));

                    for (const targetGIdx of targetIndices) {
                      const targetGroup = tempGroups[targetGIdx];
                      const candidates = targetGroup.members.filter(m => m.gender === studentA.gender);
                      
                      for (const candidate of candidates) {
                         if (canMove(studentA.id, targetGIdx) && canMove(candidate.id, groupIndex)) {
                            tempGroups[groupIndex].members = tempGroups[groupIndex].members.filter(m => m.id !== studentA.id);
                            targetGroup.members = targetGroup.members.filter(m => m.id !== candidate.id);
                            targetGroup.members.push(studentA);
                            tempGroups[groupIndex].members.push(candidate);
                            swapped = true;
                            break;
                         }
                      }
                      if (swapped) break;
                    }
                  }

                  if (constraint.type === 'pair' && g1 !== g2) {
                    hasIssue = true;
                    const student1 = tempGroups[g1].members.find(m => String(m.id) === String(constraint.s1));
                    const student2 = tempGroups[g2].members.find(m => String(m.id) === String(constraint.s2));
                    
                    const swapCandidate1 = tempGroups[g1].members.find(m => 
                      m.id !== student1.id && m.gender === student2.gender && canMove(m.id, g2)
                    );
                    
                    if (swapCandidate1 && canMove(student2.id, g1)) {
                       tempGroups[g1].members = tempGroups[g1].members.filter(m => m.id !== swapCandidate1.id);
                       tempGroups[g2].members = tempGroups[g2].members.filter(m => m.id !== student2.id);
                       tempGroups[g1].members.push(student2);
                       tempGroups[g2].members.push(swapCandidate1);
                       break; 
                    }
                  }
                }
              }

              setGroups(applyGroupStats(tempGroups, activeConstraints));
              setIsCalculating(false);
              if (viewMode === 'teacher') setActiveTab('result');
            }, 800); 
          };

          const renderHeader = () => (

                >

                </div>

              {viewMode === 'teacher' && (

                  {[
                    { id: 'input', label: '1. 名單' },

                    >
                      {tab.label}
                    </button>

            </div>

          // 共用的互動式排版渲染 (含微調換位功能)

             <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

                     <div className={`p-4 flex justify-between items-center border-b ${isStudentMode ? 'bg-gradient-to-r from-amber-100 to-orange-50 border-amber-100':'bg-slate-50 border-slate-200'}`}>
                        <span className={`text-lg font-black ${isStudentMode ? 'text-amber-900' : 'text-slate-800'}`}>第 {group.id} 組</span>
                        
                        {!isStudentMode ? (

                                        <button aria-label={`刪除${s.name}`} onClick={()=>deleteStudent(s.id)} className="text-slate-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-md transition-all opacity-100 sm:opacity-0 sm:group-hover:opacity-100"><Icon name="Trash2" className="w-4 h-4"/></button>
                                     </td>
                                  </tr>
                               ))}
                               {students.length === 0 && <tr><td colSpan="5" className="p-10 text-center text-slate-400">目前沒有資料</td></tr>}
                            </tbody>
                         </table>
                      </div>
                    </Card>
                  </div>
                )}

                {viewMode === 'teacher' && activeTab === 'constraints' && (
                   <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-in fade-in slide-in-from-bottom-4 duration-300">
                      
                      <Card className="lg:col-span-1 h-fit">
                        <CardHeader className="bg-slate-50/50"><CardTitle className="flex items-center gap-2"><Icon name="LayoutGrid" className="w-5 h-5 text-indigo-600"/> 座位配置</CardTitle></CardHeader>
                        <CardContent className="space-y-6">
                           <div>
                              <div className="flex justify-between items-center mb-3">
                                 <label className="text-xs font-bold text-slate-500">各組座位數設定</label>
                                 <span className="text-xs bg-slate-100 px-2 py-1 rounded font-bold text-slate-600">共 {groupCapacities.reduce((a,b)=>a+b,0)} 個位子</span>
                              </div>
                              <div className="space-y-2 mb-3">
                                 {groupCapacities.map((cap, i) => (
                                    <div key={i} className="flex justify-between items-center bg-slate-50 border border-slate-200 p-2 rounded-lg">
                                       <span className="text-sm font-bold text-slate-700 ml-2">第 {i+1} 組</span>
                                       <div className="flex items-center gap-3">
                                          <button onClick={()=>updateCapacity(i, -1)} className="w-7 h-7 flex items-center justify-center bg-white border border-slate-300 rounded hover:bg-slate-100"><Icon name="Minus" className="w-3 h-3 text-slate-600"/></button>
                                          <span className="font-mono font-bold w-4 text-center">{cap}</span>
                                          <button onClick={()=>updateCapacity(i, 1)} className="w-7 h-7 flex items-center justify-center bg-white border border-slate-300 rounded hover:bg-slate-100"><Icon name="Plus" className="w-3 h-3 text-slate-600"/></button>
                                          <button onClick={()=>removeGroup(i)} className="w-7 h-7 flex items-center justify-center ml-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded transition-colors"><Icon name="Trash2" className="w-3 h-3"/></button>
                                       </div>
                                    </div>
                                 ))}
                              </div>
                              <div className="flex gap-2">
                                <button onClick={addGroup} className="flex-1 bg-white border-2 border-dashed border-slate-300 text-slate-500 py-2 rounded-lg text-sm font-bold hover:bg-slate-50 hover:border-slate-400 transition-all flex items-center justify-center gap-1"><Icon name="Plus" className="w-4 h-4"/> 新增一組</button>
                              </div>
                              <button onClick={autoBalanceCapacities} className="w-full mt-3 bg-indigo-50 text-indigo-700 py-2.5 rounded-lg text-sm font-bold hover:bg-indigo-100 transition-all flex justify-center items-center gap-2"><Icon name="Calculator" className="w-4 h-4"/> 自動平均分配座位</button>
                           </div>

                           <hr className="border-slate-100"/>

                           <div>
                              <label className="text-xs font-bold text-slate-500 block mb-2">分派策略</label>
                              <div className="flex flex-col gap-2">
                                 <button onClick={()=>setAlgorithm('stratified')} className={`p-3 rounded-xl border text-left flex items-start gap-3 transition-all ${algorithm==='stratified'?'bg-emerald-50 border-emerald-300 ring-2 ring-emerald-100':'bg-white hover:bg-slate-50'}`}>
                                    <Icon name="Shuffle" className={`w-5 h-5 mt-0.5 ${algorithm==='stratified'?'text-emerald-600':'text-slate-400'}`}/>
                                    <div>
                                       <div className={`font-bold text-sm ${algorithm==='stratified'?'text-emerald-900':'text-slate-700'}`}>多維度分層隨機 (推薦)</div>
                                       <p className="text-xs text-slate-500 mt-1">完美適應不對等座位，確保性別與高低分群打散。</p>
                                    </div>
                                 </button>
                                 <button onClick={()=>setAlgorithm('snake')} className={`p-3 rounded-xl border text-left flex items-start gap-3 transition-all ${algorithm==='snake'?'bg-indigo-50 border-indigo-300 ring-2 ring-indigo-100':'bg-white hover:bg-slate-50'}`}>
                                    <Icon name="GitMerge" className={`w-5 h-5 mt-0.5 ${algorithm==='snake'?'text-indigo-600':'text-slate-400'}`}/>
                                    <div>
                                       <div className={`font-bold text-sm ${algorithm==='snake'?'text-indigo-900':'text-slate-700'}`}>S 型強制分配</div>
                                       <p className="text-xs text-slate-500 mt-1">依序嚴格發牌。</p>
                                    </div>
                                 </button>
                              </div>
                           </div>
                        </CardContent>
                      </Card>

                      <div className="lg:col-span-2 space-y-6">
                        <Card>
                           <CardHeader className="bg-slate-50/50"><CardTitle className="flex items-center gap-2"><Icon name="Link" className="w-5 h-5 text-indigo-600"/> 新增特殊規則</CardTitle></CardHeader>
                           <CardContent>
                              <div className="flex flex-col md:flex-row gap-4">
                                 <div className="w-full md:w-1/3 flex flex-col gap-2">
                                    <button onClick={()=>setConstraintInput({...constraintInput, type: 'ban'})} className={`py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all ${constraintInput.type==='ban' ? 'bg-red-50 text-red-600 border border-red-200 shadow-sm' : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                       <Icon name="Ban" className="w-4 h-4"/> 不要同組
                                    </button>
                                    <button onClick={()=>setConstraintInput({...constraintInput, type: 'pair'})} className={`py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all ${constraintInput.type==='pair' ? 'bg-blue-50 text-blue-600 border border-blue-200 shadow-sm' : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                       <Icon name="Link" className="w-4 h-4"/> 一定要同組
                                    </button>
                                    <button onClick={()=>setConstraintInput({...constraintInput, type: 'assign'})} className={`py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all ${constraintInput.type==='assign' ? 'bg-purple-50 text-purple-600 border border-purple-200 shadow-sm' : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                       <Icon name="MapPin" className="w-4 h-4"/> 指定組別
                                    </button>
                                 </div>
                                 
                                 <div className="w-full md:w-2/3 flex flex-col justify-center gap-3">
                                    <select value={constraintInput.s1} onChange={e=>setConstraintInput({...constraintInput, s1: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold focus:ring-2 focus:ring-indigo-300 outline-none">
                                       <option value="">請選擇學生 A...</option>
                                       {students.map(s=><option key={s.id} value={s.id}>{s.seatNumber}. {s.name}</option>)}
                                    </select>
                                    
                                    {constraintInput.type === 'assign' ? (
                                       <select value={constraintInput.targetGroup} onChange={e=>setConstraintInput({...constraintInput, targetGroup: e.target.value})} className="w-full p-3 bg-purple-50 border border-purple-200 text-purple-900 rounded-lg text-sm font-bold focus:ring-2 focus:ring-purple-400 outline-none">
                                          {groupCapacities.map((_, i) => (
                                             <option key={i+1} value={i+1}>📍 鎖定座位：第 {i+1} 組</option>
                                          ))}
                                       </select>
                                    ) : (
                                       <select value={constraintInput.s2} onChange={e=>setConstraintInput({...constraintInput, s2: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold focus:ring-2 focus:ring-indigo-300 outline-none">
                                          <option value="">請選擇學生 B...</option>
                                          {students.filter(s=>String(s.id)!==String(constraintInput.s1)).map(s=><option key={s.id} value={s.id}>{s.seatNumber}. {s.name}</option>)}
                                       </select>
                                    )}
                                    
                                    <button onClick={addConstraint} className="w-full bg-slate-800 text-white py-3 rounded-lg font-bold shadow hover:bg-black active:scale-95 transition-all">加入規則清單</button>
                                 </div>
                              </div>
                           </CardContent>
                        </Card>

                        <Card>
                           <CardHeader className="bg-slate-50/50"><CardTitle>已生效規則 ({constraints.length})</CardTitle></CardHeader>
                           <CardContent>
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                 {constraints.map((c, idx) => (
                                    <div key={idx} className={`flex items-center justify-between p-3 border rounded-xl shadow-sm ${c.type==='ban'?'bg-red-50 border-red-100': c.type==='pair' ? 'bg-blue-50 border-blue-100' : 'bg-purple-50 border-purple-100'}`}>
                                       
                                       {c.type === 'assign' ? (
                                          <div className="flex items-center gap-3 text-sm font-bold text-purple-800">
                                             <span className="bg-white px-2 py-1 rounded-md border border-purple-100">{getStudentName(c.s1)}</span>
                                             <Icon name="MapPin" className="w-4 h-4 text-purple-400"/>
                                             <span>第 {c.targetGroup} 組</span>
                                          </div>
                                       ) : (
                                          <div className="flex items-center gap-3 text-sm font-bold text-slate-700">
                                             <span className="bg-white px-2 py-1 rounded-md border">{getStudentName(c.s1)}</span>
                                             {c.type === 'ban' ? <Icon name="Ban" className="w-4 h-4 text-red-500"/> : <Icon name="Link" className="w-4 h-4 text-blue-500"/>}
                                             <span className="bg-white px-2 py-1 rounded-md border">{getStudentName(c.s2)}</span>
                                          </div>
                                       )}
                                       
                                       <button onClick={()=>removeConstraint(idx)} className="w-8 h-8 flex items-center justify-center bg-white rounded-full text-slate-400 hover:text-red-500 shadow-sm transition-all"><Icon name="Trash2" className="w-4 h-4"/></button>
                                    </div>
                                 ))}
                                 {constraints.length === 0 && <div className="col-span-2 text-center text-slate-400 py-10 border-2 border-dashed border-slate-200 rounded-xl">目前沒有設定任何特殊規則</div>}
                              </div>
                           </CardContent>
                        </Card>
                      </div>
                   </div>
                )}

                {viewMode === 'teacher' && activeTab === 'result' && (
                   <div className="animate-in fade-in slide-in-from-bottom-4 duration-300">
                      <div className="flex justify-between items-center mb-6">
                         <div className="flex gap-3">
                            <button onClick={generateGroups} disabled={isCalculating} className="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow hover:bg-indigo-700 hover:shadow-md active:scale-95 transition-all flex items-center gap-2">
                               <Icon name="RotateCcw" className={`w-4 h-4 ${isCalculating?'animate-spin':''}`}/> 執行運算分配
                            </button>
                            <button onClick={copyResultsToClipboard} className="px-4 py-2.5 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-xl font-bold hover:bg-indigo-100 flex items-center gap-2 transition-all">
                               <Icon name="FileText" className="w-4 h-4"/> 複製名單
                            </button>
                            <button onClick={clearGroups} className="px-4 py-2.5 bg-white border border-slate-300 text-slate-600 rounded-xl font-bold hover:bg-slate-50 flex items-center gap-2 transition-all">
                               <Icon name="Trash2" className="w-4 h-4"/> 清除
                            </button>
                         </div>
                         <div className="flex items-center gap-2">
                             {groups.some(g=>g.stats.hasConflict) && <span className="bg-red-100 text-red-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1"><Icon name="AlertCircle" className="w-4 h-4"/> 人員衝突警告</span>}
                             <div className="text-sm font-bold text-slate-500 bg-white px-4 py-2 border rounded-xl shadow-sm">
                                全體平均排名: {groups.length ? (groups.reduce((sum, g) => sum + g.members.reduce((s, m) => s + Number(m.score), 0), 0) / Math.max(1, groups.reduce((sum, g) => sum + g.members.length, 0))).toFixed(1) : '—'}
                             </div>
                         </div>
                      </div>

                      <div className="mb-6 p-3 bg-indigo-50 rounded-xl border border-indigo-100 text-indigo-800 text-sm flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-2">
                           <Icon name="Wand2" className="w-4 h-4"/>
                           <span><strong>手動微調模式：</strong> 點擊第一位學生，再點擊另一位學生或空位，即可無縫交換座位。</span>
                        </div>
                        {swapSource && <button onClick={() => setSwapSource(null)} className="px-3 py-1 bg-white text-slate-600 rounded shadow-sm text-xs font-bold hover:bg-slate-50 border">取消選擇</button>}
                      </div>
                      
                      {groups.length === 0 ? (
                         <div className="text-center py-32 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                           <Icon name="LayoutGrid" className="w-16 h-16 text-slate-200 mx-auto mb-4" />
                           <p className="text-slate-400 font-medium">請點擊上方按鈕執行運算分配</p>
                         </div>
                      ) : (
                        <>
                          {[...new Set(groups.flatMap(g => g.stats.issues || []))].length > 0 && (
                            <div role="alert" className="mb-6 bg-red-50 border border-red-200 rounded-2xl p-4 text-red-800">
                              <div className="font-bold mb-2 flex items-center gap-2"><Icon name="AlertCircle" className="w-5 h-5"/> 以下規則未能完全滿足</div>
                              <ul className="list-disc pl-6 text-sm space-y-1">
                                {[...new Set(groups.flatMap(g => g.stats.issues || []))].map(issue => <li key={issue}>{issue}</li>)}
                              </ul>
                            </div>
                          )}
                          {renderInteractiveGrid(false)}
                        </>
                      )}
                   </div>
                )}

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SeatingPlanner />);
    </script>
</body>
</html>
